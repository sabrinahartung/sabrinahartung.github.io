<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sabrina Hartung, AI Engineer: work samples in agentic AI, RAG and responsible AI."
    />
    <title>Sabrina Hartung · AI Engineer</title>

    <!-- Fonts: Ubuntu (headlines) + Poppins (body). Preconnect for speed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Set the theme before first paint to avoid a flash of the wrong theme:
         the visitor's own choice (saved when they click the toggle), else
         DEFAULT_THEME. The OS setting is deliberately ignored.
         The storage key must match THEME_STORAGE_KEY in ThemeToggle.tsx. -->
    <script>
      (function () {
        var DEFAULT_THEME = "dark"; // 👉 "dark" or "light"
        var theme = DEFAULT_THEME;
        try {
          var stored = localStorage.getItem("theme-choice");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {
          /* storage unavailable (e.g. private mode): use the default */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
