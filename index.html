<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Showcase — a selection of my projects."
    />
    <title>Showcase · Projects</title>

    <!-- Fonts: Ubuntu (headlines) + Poppins (body). Preconnect for speed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Set the theme before first paint to avoid a flash of the wrong theme.
         Uses the stored preference, else falls back to the OS setting. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          document.documentElement.dataset.theme =
            stored || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
